  <g fill="#fff6e5" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2">
    <text x="56" y="382">NEXT.JS 16</text><text x="245" y="382">REACT 19</text><text x="420" y="382">MOTION + LENIS</text><text x="686" y="382">TAILWIND CSS 4</text><text x="1007" y="382">MADE TO REBRAND ↗</text>
